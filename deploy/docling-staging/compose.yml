name: ecohatun-docling-staging
services:
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.38.2@sha256:7a480a1604fa3b42efeddc7db9527690d9f9bc903226136013e2bfe6b1a4dfb0
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_STAGING_API_KEY:?Configure the staging key in Dokploy}
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENG_KIND: local
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      UVICORN_WORKERS: "1"
      DOCLING_DEVICE: cpu
      DOCLING_NUM_THREADS: "1"
      DOCLING_SERVE_MAX_SOURCES_PER_REQUEST: "1"
      DOCLING_SERVE_MAX_NUM_PAGES: "10"
      DOCLING_SERVE_MAX_FILE_SIZE: "10485760"
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "90"
      DOCLING_SERVE_SINGLE_USE_RESULTS: "true"
    cpus: 1.0
    mem_limit: 2560m
    restart: "no"
    networks:
      multimedia_staging:
        aliases:
          - docling-staging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
networks:
  multimedia_staging:
    internal: true
