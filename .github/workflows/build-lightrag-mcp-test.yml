name: Build LightRAG MCP isolated test image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch"
        required: true
        default: "fix/ecohatun-local-storage"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Check Python syntax
        run: python -m py_compile deploy/lightrag-mcp/server.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push isolated test image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/lightrag-mcp
          file: ./deploy/lightrag-mcp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ecohatun/ecohatun-lightrag-mcp:isolated-test
          cache-from: type=gha,scope=lightrag-mcp
          cache-to: type=gha,mode=max,scope=lightrag-mcp
