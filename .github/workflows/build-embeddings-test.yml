name: Build embeddings isolated test image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref containing the embeddings source"
        required: true
        default: "fix/ecohatun-local-storage"
      image_tag:
        description: "Unique test tag, never latest"
        required: true
        default: "openai-test"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Check JavaScript syntax
        run: node --check deploy/local-embeddings/server.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push isolated embeddings test image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/local-embeddings
          file: ./deploy/local-embeddings/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ecohatun/ecohatun-embeddings:${{ inputs.image_tag }}
          cache-from: type=gha,scope=embeddings-test
          cache-to: type=gha,mode=max,scope=embeddings-test
